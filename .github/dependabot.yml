version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    exclude-paths:
      # Vendored Cordis sources follow vendor/README.md instead of registry updates.
      - "vendor/**"
    # One open update per ecosystem: every Dependabot PR starts the whole
    # pull-request workflow set, and the fork's runner pool is the bottleneck.
    open-pull-requests-limit: 1
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"

  - package-ecosystem: "uv"
    directory: "/python/sdk"
    # One open update per ecosystem: every Dependabot PR starts the whole
    # pull-request workflow set, and the fork's runner pool is the bottleneck.
    open-pull-requests-limit: 1
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"

  - package-ecosystem: "github-actions"
    directory: "/"
    # One open update per ecosystem: every Dependabot PR starts the whole
    # pull-request workflow set, and the fork's runner pool is the bottleneck.
    open-pull-requests-limit: 1
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"
